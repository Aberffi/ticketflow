server:
  port: 8888
spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/Aberffi/ticketflow-config.git}
          default-label: main
          try-master-branch: false
          clone-on-start: true
          force-pull: true
          refresh-rate: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info
